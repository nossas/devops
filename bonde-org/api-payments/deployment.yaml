apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-payments
  namespace: bonde-org
  labels:
    app: api-payments
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-payments
  template:
    metadata:
      labels:
        app: api-payments
    spec:
      containers:
      - name: api-payments
        image: nossas/bonde-apis:latest
        command: ["pnpm", "--filter", "payments-api", "start"]
        ports:
        - containerPort: 3000
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "development"
        - name: GRAPHQL_HTTP_URL
          value: "http://api-graphql:80/v1/graphql"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET
        - name: HASURA_SECRET
          valueFrom:
            secretKeyRef:
              name: hasura-admin-secret
              key: HASURA_SECRET
        - name: PAGARME_API_KEY
          valueFrom:
            secretKeyRef:
              name: pagarme-key
              key: PAGARME_API_KEY
        resources:
          requests:
            memory: "200Mi"
            cpu: "50m"
          limits:
            memory: "500Mi"
            cpu: "200m"