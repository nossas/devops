apiVersion: apps/v1
kind: Deployment
metadata:
  name: wp-bonde
  namespace: bonde-org
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wp-bonde
  template:
    metadata:
      labels:
        app: wp-bonde
    spec:
      containers:
      - name: wp-bonde
        image: wordpress:6.9-php8.2-apache
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        env:
        # Configurações do banco MySQL
        - name: WORDPRESS_DB_HOST
          valueFrom:
            secretKeyRef:
              name: wordpress-db-secrets
              key: db-host
        - name: WORDPRESS_DB_NAME
          valueFrom:
            secretKeyRef:
              name: wordpress-db-secrets
              key: db-name
        - name: WORDPRESS_DB_USER
          valueFrom:
            secretKeyRef:
              name: wordpress-db-secrets
              key: db-user
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wordpress-db-secrets
              key: db-password
        
        # Configurações opcionais (podem ser removidas se usar wp-config personalizado)
        - name: WORDPRESS_TABLE_PREFIX
          value: "wp_"
        - name: WORDPRESS_DEBUG
          value: "0"
        
        # Configurações de PHP para uploads maiores
        - name: PHP_MEMORY_LIMIT
          value: "256M"
        - name: PHP_UPLOAD_MAX_FILESIZE
          value: "100M"
        - name: PHP_POST_MAX_SIZE
          value: "110M"
        
        # Health checks simplificados
        livenessProbe:
          httpGet:
            path: /readme.html
            port: 80
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /readme.html
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
        
        # Limites de recursos
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Mount dos volumes
        volumeMounts:
        - name: wordpress-storage
          mountPath: /var/www/html
        - name: php-config
          mountPath: /usr/local/etc/php/conf.d/99-uploads.ini
          subPath: uploads.ini
        
        # Configurações de segurança do container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        
      volumes:
      - name: wordpress-storage
        persistentVolumeClaim:
          claimName: wp-bonde-data
      - name: php-config
        configMap:
          name: wp-bonde-php-config