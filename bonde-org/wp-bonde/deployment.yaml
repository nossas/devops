apiVersion: apps/v1
kind: Deployment
metadata:
  name: wp-bonde
  namespace: bonde-org
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wp-bonde
  template:
    metadata:
      labels:
        app: wp-bonde
    spec:
      # ✅ INITCONTAINER CORRIGIDO
      initContainers:
      - name: install-php-redis
        image: wordpress:6.9-php8.2-apache
        command:
        - /bin/bash
        - -c
        - |
          set -eux
          echo "📦 Instalando extensão Redis..."
          
          apt-get update
          apt-get install -y --no-install-recommends git libssl-dev
          
          # ✅ Instala o mysqli explicitamente
          docker-php-ext-install -j$(nproc) mysqli
          
          # Instala o Redis
          pecl install redis
          
          # ✅ Habilita AMBAS as extensões
          docker-php-ext-enable redis mysqli
          
          # Verifica
          php -m | grep -E "redis|mysqli"
          echo "✅ Extensões instaladas: redis e mysqli"
        volumeMounts:
        - name: wordpress-storage
          mountPath: /var/www/html
        - name: php-extensions
          mountPath: /usr/local/lib/php/extensions
        - name: php-conf
          mountPath: /usr/local/etc/php/conf.d
      
      containers:
      - name: wp-bonde
        image: wordpress:6.9-php8.2-apache
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        env:
        # Configurações do banco MySQL
        - name: WORDPRESS_DB_HOST
          valueFrom:
            secretKeyRef:
              name: wordpress-db-secrets
              key: db-host
        - name: WORDPRESS_DB_NAME
          valueFrom:
            secretKeyRef:
              name: wordpress-db-secrets
              key: db-name
        - name: WORDPRESS_DB_USER
          valueFrom:
            secretKeyRef:
              name: wordpress-db-secrets
              key: db-user
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wordpress-db-secrets
              key: db-password
        
        - name: WORDPRESS_TABLE_PREFIX
          value: "wp_"
        - name: WORDPRESS_DEBUG
          value: "0"
        
        - name: PHP_MEMORY_LIMIT
          value: "512M"
        - name: PHP_UPLOAD_MAX_FILESIZE
          value: "100M"
        - name: PHP_POST_MAX_SIZE
          value: "110M"

        # Configuração do Redis
        - name: WP_REDIS_HOST
          value: "redis"
        - name: WP_REDIS_PORT
          value: "6379"
        - name: WP_REDIS_DATABASE
          value: "0"
        - name: WP_REDIS_TIMEOUT
          value: "1"
        - name: WP_REDIS_READ_TIMEOUT
          value: "1"
        - name: WP_REDIS_PREFIX
          value: "wp_bonde_"

        # ✅ WORDPRESS_CONFIG_EXTRA SEM WP_CACHE DUPLICADO
        - name: WORDPRESS_CONFIG_EXTRA
          value: |
            define('WP_REDIS_HOST', getenv('WP_REDIS_HOST') ?: 'redis');
            define('WP_REDIS_PORT', getenv('WP_REDIS_PORT') ?: 6379);
            define('WP_REDIS_DATABASE', getenv('WP_REDIS_DATABASE') ?: 0);
            define('WP_REDIS_TIMEOUT', getenv('WP_REDIS_TIMEOUT') ?: 1);
            define('WP_REDIS_READ_TIMEOUT', getenv('WP_REDIS_READ_TIMEOUT') ?: 1);
            define('WP_REDIS_PREFIX', getenv('WP_REDIS_PREFIX') ?: 'wp_bonde_');
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "1024Mi"
            cpu: "800m"
        
        volumeMounts:
        - name: wordpress-storage
          mountPath: /var/www/html
        - name: php-config
          mountPath: /usr/local/etc/php/conf.d/99-uploads.ini
          subPath: uploads.ini
        - name: php-extensions
          mountPath: /usr/local/lib/php/extensions
        - name: php-conf
          mountPath: /usr/local/etc/php/conf.d
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        
      volumes:
      - name: wordpress-storage
        persistentVolumeClaim:
          claimName: wp-bonde-data
      - name: php-config
        configMap:
          name: wp-bonde-php-config
      - name: php-extensions
        emptyDir: {}
      - name: php-conf
        emptyDir: {}