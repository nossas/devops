apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-domains
  namespace: bonde-org
  labels:
    app: api-domains
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-domains
  template:
    metadata:
      labels:
        app: api-domains
    spec:
      containers:
      - name: api-domains
        image: nossas/bonde-apis:latest
        command: ["pnpm", "--filter", "domains-api", "start"]
        ports:
        - containerPort: 3000
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "development"
        - name: GRAPHQL_HTTP_URL
          value: "http://api-graphql:80/v1/graphql"
        - name: AWS_ROUTE53_REGION
          value: "us-east-1"
        - name: HASURA_SECRET
          valueFrom:
            secretKeyRef:
              name: hasura-admin-secret
              key: HASURA_SECRET
        - name: AWS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: aws-secret-key
              key: AWS_SECRET_KEY
        - name: AWS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-access-key
              key: AWS_ACCESS_KEY
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET
        resources:
          requests:
            memory: "200Mi"
            cpu: "50m"
          limits:
            memory: "500Mi"
            cpu: "200m"