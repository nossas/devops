apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-actions
  namespace: bonde-org
  labels:
    app: api-actions
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-actions
  template:
    metadata:
      labels:
        app: api-actions
    spec:
      containers:
      - name: api-actions
        image: nossas/bonde-actions-api:hotfix-redirect-phone-status
        command: ["uvicorn"]  # Sobrescreve o CMD
        args: ["app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--log-level", "info"]
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bonde-database-url-v2
              key: DATABASE_URL
        - name: BASE_URL
          value: "https://actions-api.bonde.org"
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: twilio-secret
              key: TWILIO_ACCOUNT_SID
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: twilio-secret
              key: TWILIO_AUTH_TOKEN
        - name: TWILIO_PHONE_NUMBER
          valueFrom:
            secretKeyRef:
              name: twilio-secret
              key: TWILIO_PHONE_NUMBER
        - name: GRAPHQL_API_URL
          value: "http://api-graphql:80/v1/graphql"
        - name: GRAPHQL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: hasura-admin-secret
              key: HASURA_SECRET
        resources:
          requests:
            memory: "200Mi"
            cpu: "50m"
          limits:
            memory: "500Mi"
            cpu: "200m"