apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: bonde-org
  labels:
    app: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
      - name: n8n
        image: n8nio/n8n:2.9.4
        # image: n8nio/n8n:1.108.2
        imagePullPolicy: Always
        ports:
        - containerPort: 5678
          protocol: TCP
        env:
        - name: DB_TYPE
          value: postgresdb
        - name: DB_POSTGRESDB_SSL_ENABLED
          value: "true"
        - name: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
          value: "false"
        - name: WEBHOOK_URL
          value: https://n8n.bonde.org
        - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
          value: "true"
        - name: N8N_LOG_LEVEL
          value: debug
        - name: N8N_PROTOCOL
          value: http
        - name: N8N_PORT
          value: "5678"
        - name: N8N_HOST
          value: 0.0.0.0
        - name: N8N_PROXY
          value: "true"
        - name: N8N_EMAIL_MODE
          value: smtp
        - name: N8N_SMTP_SENDER
          value: N8N <tech@bonde.org>
        - name: N8N_SMTP_SSL
          value: "false"
        - name: N8N_SMTP_TLS
          value: "true"
        # Secrets
        - name: DB_POSTGRESDB_DATABASE
          valueFrom:
            secretKeyRef:
              name: n8n-database-secret
              key: DB_POSTGRESDB_DATABASE
        - name: DB_POSTGRESDB_HOST
          valueFrom:
            secretKeyRef:
              name: n8n-database-secret
              key: DB_POSTGRESDB_HOST
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-database-secret
              key: DB_POSTGRESDB_PASSWORD
        - name: DB_POSTGRESDB_PORT
          valueFrom:
            secretKeyRef:
              name: n8n-database-secret
              key: DB_POSTGRESDB_PORT
        - name: DB_POSTGRESDB_USER
          valueFrom:
            secretKeyRef:
              name: n8n-database-secret
              key: DB_POSTGRESDB_USER
        - name: N8N_SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: smtp-secret
              key: N8N_SMTP_HOST
        - name: N8N_SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: smtp-secret
              key: N8N_SMTP_PORT
        - name: N8N_SMTP_USER
          valueFrom:
            secretKeyRef:
              name: smtp-secret
              key: N8N_SMTP_USER
        - name: N8N_SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: smtp-secret
              key: N8N_SMTP_PASS
        - name: N8N_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: n8n-webhook-secret
              key: N8N_WEBHOOK_SECRET
        resources:
          requests:
            cpu: 20m
            memory: 500Mi
          limits:
            cpu: 200m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5678
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5678
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        volumeMounts:
        - mountPath: /home/node/.n8n
          name: n8n-data
      volumes:
      - name: n8n-data
        emptyDir: {}
        # persistentVolumeClaim:
        #   claimName: n8n-data